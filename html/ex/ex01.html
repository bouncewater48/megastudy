<!DOCTYPE html> 
    
<html>
    <head>
        <title>HTML 기본 문법</title>
    </head>
    <body>
        <!-- HTML 주석 -->

        <!-- 줄 바꿈 -->
        안녕하세요 HTML을 시작합니다. <br>
        결과가 바로 화면에 보여서 재미있어요. <br>
        여러 태그를 배워서 활용해 봐요! <br>
        <br>
        화이팅!!!!

        <!-- 문단 나누기 -->
         <p>
            첫번째 문단 입니다. <br>
            여러 문장을 묶어 놓은 단위 입니다.
         </p>

         <p>
            두번째 문단 입니다. <br>
            윗 문단과 구분이 됩니다.
         </p>

         <!-- 제목 -->
          <h1>제목1</h1>
          <h2>제목2</h2>
          <h3>제목3</h3>
          <h4>제목4</h4>
          <h5>제목5</h5>
          <h6>제목6</h6>

         <!-- 선 -->
           <hr>

         <!-- 내용 그대로 보여주기 -->
          <pre>
내용이 있는 그대로 보여 집니다.
br 태그가 없어도 줄이 바뀌네요?
            긴 인용문을 복사 붙여 넣기로 
            손 쉽게 작성하기 위한 용도
          </pre>

          <!-- 글씨 진하게 -->
          일반 글씨 <br>
          <b>진한 글씨</b>

          <!-- 여러 태그 복합적으로 사용하기 -->
           <p>
            오늘 저녁 메뉴는 <b>치킨</b> 입니다. <br>
            맛있겠다!
           </p>
    </body>
</html>
