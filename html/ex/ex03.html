<!DOCTYPE html>

<html>
    <head>
        <title>입력 태그</title>
    </head>

    <body>
        <h3>1. 입력 태그</h3>
        <!-- <input type="text"> -->
        <label>아이디</label> <input type="text" placeholder="아이디를 입력하세요">
        <!-- <label>은 굳이 작성하지 않아도 되나, input에 대한 설명을 작성하는 용도로 사용한다 -->
        <br>
        <label>비밀번호</label> <input type="password">

        <h3>2. 라디오 버튼</h3>
        <!-- <input type="radio"> -->
        <label>남성 <input type="radio" name="gender"> </label>
        <label>여성 <input type="radio" name="gender"> </label>

        <h3>3. 체크박스</h3>
        <!-- <input type="checkbox"> -->
        <label>독서 <input type="checkbox"> </label>
        <label>게임 <input type="checkbox" checked> </label>
        <label>헬스 <input type="checkbox"> </label>

        <h3>4. 파일 입력</h3>
        <input type="file">

        <h3>5. 버튼</h3>
        <button type="button">입력</button>

        <h3>6. 셀렉트 박스</h3>
        <select>
            <option>사과</option>
            <option>바나나</option>
            <option>배</option>
        </select>

        <h3>7. 텍스트 에어리어</h3>
        <textarea rows="10" cols="50">
안녕
        그대로 보여진다
        </textarea>
    </body>
</html>
