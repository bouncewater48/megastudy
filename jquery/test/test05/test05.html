<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>111번가 - 회원가입</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div id="wrap">
            <header class="d-flex align-items-center">
                <div class="display-4 text-danger">111 번가</div>
            </header>
            <section class="contents d-flex justify-content-center">
                <div class="join-box my-4">
                    <h1>가입 정보 입력</h1>
                    <div>111번가의 다양한 혜택을 누려보세요!</div>
                    <label class="mt-3">아이디</label>
                    <input type="text" class="form-control" id="idInput">
                    <div class="text-info small" id="idinfoMessage">아이디를 4자 이상 입력하세요</div>
                    <label class="mt-2">비밀번호</label>
                    <input type="password" class="form-control" id="passwordInput">
                    <label class="mt-2">비밀번호 확인</label>
                    <input type="password" class="form-control" id="passwordConfirmInput">
                    <label class="mt-2">이름</label>
                    <input type="text" class="form-control" id="nameInput">
                    <label class="mt-2">이메일</label>
                    <div class="d-flex align-items-center">
                        <input type="text" class="form-control" id="emailIdInput">
                        <div class="mx-1">@</div>
                        <select class="form-control" id="emailDomainSelect">
                            <option>naver.com</option>
                            <option>gmail.com</option>
                            <option>kakao.com</option>
                            <option value="custom">직접 입력</option>
                        </select>
                        <input id="emailDomainInput" type="text" class="form-control d-none">
                    </div>
                    <button type="button" id="joinBtn" class="btn btn-danger btn-block">가입 하기</button>

                </div>
            </section>
            <footer>
                <div class="text-center">Copyright 2025. 111st All Rights Reserved</div>
            </footer>
        </div>
        
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
        <script>

            $("#idInput").on("input", function() {
                
                let id = $(this).val();

                if(id.length < 4) {
                    $("#idInfoMessage").removeClass("d-none");
                } else {
                    $("#idInfoMessage").addClass("d-none")
                }
            });

            $("#emailDomainSelect").on("change", function() {
                let emailDomain = $(this).val();

                if(emailDomain == "custom") {
                    $(this).addClass("d-none");
                    $("#emailDomainInput").removeClass("d-none");
                }

            });


            $("#joinBtn").on("click", function() {
                let id = $("#idInput").val();
                let password = $("#passwordInput").val();
                let passwordConfirm = $("#passwordConfirmInput").val();
                let name = $("#nameInput").val();
                let emailId = $("#emailIdInput").val();
                let emailDomain = $("#emailDomainSelect").val();
            
                if(emailDomain == "custom") {
                    emailDomain = $("#emailDomainInput").val();
                }

                // 유효성 검사 (validation)
                if(id == "") {
                    alert("아이디를 입력하세요.");
                    return ;
                }

                if(password == "") {
                    alert("비밀번호를 입력하세요.");
                    return ;
                }

                if(password != passwordConfirm) {
                    alert("비밀번호가 일치하지 않습니다.");
                    return ;
                }

                if(name == "") {
                    alert("이름을 입력하세요.");
                    return ;
                }

                if(emailId == "") {
                    alert("이메일 아이디를 입력하세요.");
                    return ;
                }

                if(emailDomain == "") {
                    alert("이메일 도메인을 입력하세요");
                    return ;
                }

                alert("아이디 : " + id + "\n이름 : " + name + "\n이메일 : " + emailId + "@" + emailDomainSelect + "\n가입이 완료 되었습니다.");

            });

        </script>

    </body>
</html>
