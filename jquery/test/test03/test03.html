<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <title>datepicker 사용하기</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
</head>

<body>
    <h2>행사 일정 입력</h2>
    <label>행사 제목</label> <br>
    <input type="text" value="웹 프로그래밍 대회">
    <br>
    <br>
    <div class="input-group col-6">
    <div class="d-flex">
        <div>
            <label class="mr-2">시작 일 </label>
            <input type="text" id="startDate">
        </div>
        <div>
            <label class="mr-2">종료 일 </label>
            <input type="text" id="finishDate">
        </div>
    </div>
    <button type="button" class="btn btn-primary btn-block mt-4">저장</button>


    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>

    <script>

        // datepicker 기본 설정을 변경
        $(function () {
            $.datepicker.setDefaults({
                dateFormat: "yy-mm-dd",
                minDate: 0,
                dayNamesMin: ['일', '월', '화', '수', '목', '금', '토'],
                // dayNames: ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'],
                // monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                // monthNamesShort: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                // showMonthAfterYear: true,
                // yearSuffix: '년'
            });
        });

        $("#startDate").datepicker({
            minDate: 0,
            onSelect: function (selected) {
                $("#finishDate").datepicker("option", "minDate", selected);

                // 이미 선택된 종료일이 시작일보다 이전이면 사용 불가로
                let start = $(this).datepicker("getDate");
                let finish = $("#finishDate").datepicker("getDate");
                if (finish && finish < start) {
                    $("#finishDate").datepicker("setDate", start);
                }
            }
        });

        $("#finishDate").datepicker({});

    </script>

</body>

</html>
