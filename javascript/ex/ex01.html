<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>JavaScript 기초</title>
    </head>

    <body>

        <script>
            // alert("Hello World!!");
            // alert : 경고창처럼 상단에 뜨는 팝업

            // 변수
            // 정수 변수
            let number = 100;

            console.log("number : " + number);

            // 문자열 변수
            let text = "Hello World!!";
            console.log("text : " + text);

            // 조건문
            // 정수 비교
            if(number == 100) {
                console.log("number은 100이다.");

                // 지역 변수
                let local = 10;

                // 전역 변수
                // 생성 후 추적이 어렵기에 가능하면 전역변수는 안쓰는것을 권장
                var global = 20;
            }

            // console.log(local);
            console.log(global);

            // 문자열 비교
            if(text == "Hello World!!") {
                console.log("text는 Hello World!! 다");
            }

            let stringNumber = "10";
            let integerNumber = 10;

            // 자바스크립트에서는 다른 타입의 변수 비교가 가능하다
            // 비교가능한 타입으로 전환해서 비교해준다
            if(stringNumber == integerNumber) {
                console.log("문자열 10과 정수 10이 같다");
            }

            // 타입까지 일치하는지 확인
            if(stringNumber === integerNumber) {
                console.log("문자열 10과 정수 10이 타입까지 일치한다");
            }

            // 비어 있는 변수 처리
            let empty;

            console.log(empty);

            // null
            let nullVariable = null;
            console.log(nullVariable);

            if(empty == nullVariable) {
                console.log("undefined 와 null은 같다");
            }

            if(empty == null) {
                console.log("empty 는 null 이다");
            }

            if(nullVariable == undefined) {
                console.log("nullVariable 은 undefined 이다");
            }

            if(empty === nullVariable) {
                console.log("undefiend 와 null은 같다")
            }


        </script>
    </body>
</html>
