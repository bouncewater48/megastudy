        // 2. 파일 이름
        // 파일 경로가 저장된 문자열이 있다.
        // 해당 문자열에서 파일 이름을 추출하여 console로 출력하세요.
        // let path = "/Users/master/Document/image/city.jpg";
        // 출력 예시

        // city.jpg

        let path = "/Users/master/Document/image/city.jpg";

        let array = path.split("/");
        console.log(array[array.length - 1]); // 항상 배열 마지막에 적혀있는 파일명으로 출력되게끔


        // 3. 데이터 정리
        // 아래와 같이 사용자가 입력한 내용을 dictionary에 저장하였다.
        // let info = {
        //     "name":"김 인규",
        //     "phoneNumber":"01012345678",
        //     "introduce":"    안녕하세요. 저는 기분이 좋네요.  "
        // };
        // 해당 내용을 아래와 같은 형태로 출력하세요.
        // 출력 예시

        // 이름 : 김인규 전화번호 : 010-1234-5678 소개 : 안녕하세요. 저는 기분이 좋네요.

        let info = {
            "name": "김 인규",
            "phoneNumber": "01012345678",
            "introduce": "    안녕하세요. 저는 기분이 좋네요.  "
        };

        let name = info.name.replace(" ", " "); //공백 제거

        let phoneNumber = info.phoneNumber.substring(0, 3) + "-" + info.phoneNumber.substring(3, 7) + "-" + info.phoneNumber.substring(7);

        let introduce = info.introduce.trim();

        console.log("이름 : " + name + " 전화번호 : " + phoneNumber + " 자기소개 : " + introduce);



        // 4. 문자열 데이터
        // 아래와 같이 특정한 규칙으로 회원의 이름과 생년월일이 문자열로 저장되어 있다.
        // let membersString = "루피:19931005,조로:19890513,나미:19970705,쵸파:20040932";
        // 문자열 함수를 사용해서 아래와 같은 형태의 데이터형으로 만들고 객체 그대로 console로 출력하세요.
        // [
        //     {name: "루피", birth: "19931005"}
        //     {name: "조로", birth: "19890513"}
        //     {name: "나미", birth: "19970705"}
        //     {name: "쵸파", birth: "20040932"}
        // ]
        // (4) [{…}, {…}, {…}, {…}]
        // 0: {name: "루피", birth: "19931005"}
        // 1: {name: "조로", birth: "19890513"}
        // 2: {name: "나미", birth: "19970705"}
        // 3: {name: "쵸파", birth: "20040932"}
        // length: 4

        let membersString = "루피:19931005,조로:19890513,나미:19970705,쵸파:20040932";

        let membersArray = membersString.split(",");

        console.log(membersArray);

        let memberInfoArray = [];

        for (let i = 0; i < membersArray.length; i++) {
            let memberString = membersArray[i];
            console.log(memberString);

            let memberArray = memberString.split(":");
            console.log(memberArray);

            let memberInfo = { "name": memberArray[0], "birth": memberArray[1] };
            // console.log(memberInfo);
            memberInfoArray.push(memberInfo);
        }

        console.log(memberInfoArray);


        // 5. 생월 찾기
        // 위 문제에서 만들어진 데이터를 이용해서 7월 생의 이름을 console로 출력하세요.
        // 출력 예시

        // 나미

        for(let memberInfo of memberInfoArray) {
            let month = memberInfo.birth.substring(4, 6);
            // console.log(month);
            // if(month == 7) {
            if(month == "07") {  // 자바스크립트에서는 "07"이나 7이나 같은거로 취급한다
                console.log(memberInfo.name);
            }
        }

    </script>
